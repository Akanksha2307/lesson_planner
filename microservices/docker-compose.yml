# Start everything:  docker compose up --build -d      Stop:  docker compose down
# Each service needs its .env.docker file (not in Git – values are shared privately).
services:
  auth-service:
    build: ./services/auth-service
    image: qshikshak/auth-service
    env_file: ./services/auth-service/.env.docker
    ports:
      - "5001:5001"
    restart: unless-stopped

  lesson-plan-service:
    build: ./services/lesson-plan-service
    image: qshikshak/lesson-plan-service
    env_file: ./services/lesson-plan-service/.env.docker
    environment:
      # Inside compose it finds auth-service by its name
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    image: qshikshak/api-gateway
    env_file: ./services/api-gateway/.env.docker
    environment:
      AUTH_URL: http://auth-service:5001
      LESSON_PLAN_URL: http://lesson-plan-service:5002
      # Not in compose yet – reach it on the laptop until it is added
      APPROVAL_URL: http://host.docker.internal:5003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      auth-service:
        condition: service_healthy
      lesson-plan-service:
        condition: service_healthy
    restart: unless-stopped

  # approval-service gets added here when it is fixed