# Start everything:  docker compose up --build      Stop:  docker compose down
# Each service needs its .env.docker file (not in Git – values are shared privately).
# Inside compose, services find each other by name (http://auth-service:5001 …).
services:
  auth-service:
    build: ./services/auth-service
    image: qshikshak/auth-service
    env_file: ./services/auth-service/.env.docker
    ports:
      - "5001:5001"
    restart: unless-stopped

  lesson-plan-service:
    build: ./services/lesson-plan-service
    image: qshikshak/lesson-plan-service
    env_file: ./services/lesson-plan-service/.env.docker
    environment:
      APPROVAL_URL: http://approval-service:5003
    ports:
      - "5002:5002"
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  approval-service:
    build: ./services/approval-service
    image: qshikshak/approval-service
    env_file: ./services/approval-service/.env.docker
    environment:
      LESSON_PLAN_URL: http://lesson-plan-service:5002
    ports:
      - "5003:5003"
    depends_on:
      lesson-plan-service:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    image: qshikshak/api-gateway
    env_file: ./services/api-gateway/.env.docker
    environment:
      AUTH_URL: http://auth-service:5001
      LESSON_PLAN_URL: http://lesson-plan-service:5002
      APPROVAL_URL: http://approval-service:5003
    ports:
      - "5000:5000"
    depends_on:
      auth-service:
        condition: service_healthy
      lesson-plan-service:
        condition: service_healthy
      approval-service:
        condition: service_healthy
    restart: unless-stopped